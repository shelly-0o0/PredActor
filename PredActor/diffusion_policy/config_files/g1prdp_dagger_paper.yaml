_target_: dagger.trainer.DaggerTrainer

defaults:
  - defaults/data_collection
  - defaults/dataloader
  - defaults/val_dataloader
  - defaults/ema
  - defaults/logging_base
  - defaults/optimizer
  - defaults/policy/cond_codiffuse
  - defaults/dataset/base
  - defaults/training
  - defaults/checkpoint
  - defaults/env_runner
  - defaults/env/mujoco
  - _self_

exp_name: paper-dagger
output_dir: "${oc.env:PREDACTOR_OUTPUT_ROOT,./outputs}/"
dataset_dir: "${oc.env:PREDACTOR_DATASET_ROOT,./Artifacts/dataset}"

logging:
  group: paper-dagger
  id: null
  mode: offline
  name: paper-dagger
  project: diffuse_cloc
  resume: false
  tags: [g1prdp, paper-dagger, aggregate-replay, 152-motion]

policy:
  condition_dropout_config:
    enable: false
  actor:
    _target_: diffusion_policy.modules.diffuse_cprdp.DiffuseCPRDP
    enable_root_pos_guide: false
    # Keep the same actor and reconstruction objective used by pi0.  DAgger
    # changes replay data only; it does not introduce a DAgger-specific loss.
    whole_body_guidance_config:
      enabled: true
    backbone:
      x_input_dim: 384
      x_output_dim: 384
      cond_dim: 608
      n_cond_steps: 4
      cross_attn_mode: full
    clean_past_state: false
    no_state_override: true
    data_profile: g1_prdp_standard_cond
    ddim_steps: 5
    ddim_eta: 0.0
    use_ns_ddim: true
    randomize_noise_schedule: true
    action_weight_schedule: constant-to-8
    action_rate_target_mode: clean_action_smooth
    action_rate_loss_scale: 0.1

dataset:
  _target_: dagger.dataset.StrictDaggerDataset
  data_profile: g1_prdp_standard_cond
  zarr_path: "${oc.env:PREDACTOR_DAGGER_MANIFEST}"
  n_task_steps: 4
  load_to_memory: false
  symm_aug: false
  text_replacement_probability: 0.0
  # Paper DAgger is dataset aggregation: every available D0 and D1 window is
  # present once in replay.  Do not inflate a small D1 shard to a fixed ratio.
  sampling_mode: aggregate
  use_action_valid_mask: false
  epoch_size: null
  dropout_config_train_overrides:
    text_cond:
      enabled: false
  data_sample_rate: 0.0

optimizer:
  learning_rate: 1.0e-5
  weight_decay: 0.001
  betas: [0.9, 0.95]

training:
  num_epochs: 1
  max_train_steps: null
  resume: false
  use_ema: true
  lr_scheduler: constant
  lr_warmup_steps: 0
  checkpoint_every: 1
  save_epoch_checkpoints: true
  save_terminal_checkpoint: true

dagger:
  init_checkpoint: "${oc.env:PREDACTOR_PI0_CHECKPOINT}"
  init_replica: ema_agent

dataloader:
  batch_size: 256
  num_workers: 8
  persistent_workers: true
  pin_memory: true
  shuffle: true
  prefetch_factor: 2
